<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#183153" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#54708f"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#142b4a">No Memory Required · 系统架构</text>
  <text x="600" y="87" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#60758d">离线词库导入 → 输入法服务 → 前缀匹配 → 候选词上屏</text>

  <rect x="55" y="145" width="310" height="455" rx="22" fill="#ffffff" stroke="#b8cee8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="55" y="145" width="310" height="60" rx="22" fill="#e7f1ff"/>
  <rect x="55" y="183" width="310" height="22" fill="#e7f1ff"/>
  <text x="210" y="182" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1e5a99">词库管理端</text>
  <rect x="92" y="242" width="236" height="72" rx="14" fill="#f5f9ff" stroke="#b8cee8"/>
  <text x="210" y="271" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#203c5c">MainActivity</text>
  <text x="210" y="296" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#60758d">替换 · 追加 · 清空</text>
  <rect x="92" y="352" width="236" height="72" rx="14" fill="#f5f9ff" stroke="#b8cee8"/>
  <text x="210" y="381" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#203c5c">Android 文档选择器</text>
  <text x="210" y="406" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#60758d">ACTION_OPEN_DOCUMENT · text/*</text>
  <path d="M210 314 L210 352" fill="none" stroke="#54708f" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="445" y="145" width="310" height="455" rx="22" fill="#ffffff" stroke="#b8cee8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="445" y="145" width="310" height="60" rx="22" fill="#e9fbf4"/>
  <rect x="445" y="183" width="310" height="22" fill="#e9fbf4"/>
  <text x="600" y="182" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#137552">应用私有存储</text>
  <rect x="482" y="242" width="236" height="84" rx="14" fill="#f3fcf8" stroke="#a9ddc7"/>
  <text x="600" y="274" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#205b47">user_dict.txt</text>
  <text x="600" y="301" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#537a6b">每行：English,Chinese,Pinyin</text>
  <rect x="482" y="372" width="236" height="84" rx="14" fill="#f3fcf8" stroke="#a9ddc7"/>
  <text x="600" y="404" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#205b47">词库加载器</text>
  <text x="600" y="431" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#537a6b">启动加载 · 时间戳热刷新</text>
  <path d="M365 388 L482 284" fill="none" stroke="#54708f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M600 326 L600 372" fill="none" stroke="#54708f" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="835" y="145" width="310" height="455" rx="22" fill="#ffffff" stroke="#b8cee8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="835" y="145" width="310" height="60" rx="22" fill="#fff1e8"/>
  <rect x="835" y="183" width="310" height="22" fill="#fff1e8"/>
  <text x="990" y="182" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#b35b22">输入法服务</text>
  <rect x="872" y="242" width="236" height="72" rx="14" fill="#fff8f2" stroke="#efc5a5"/>
  <text x="990" y="271" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#70451f">MyInputMethodService</text>
  <text x="990" y="296" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#8d6b4d">InputMethodService 生命周期</text>
  <rect x="872" y="352" width="236" height="72" rx="14" fill="#fff8f2" stroke="#efc5a5"/>
  <text x="990" y="381" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#70451f">前缀匹配</text>
  <text x="990" y="406" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#8d6b4d">English / Pinyin → 中文候选</text>
  <rect x="872" y="462" width="236" height="72" rx="14" fill="#fff8f2" stroke="#efc5a5"/>
  <text x="990" y="491" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#70451f">QWERTY 键盘 + 候选栏</text>
  <text x="990" y="516" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" fill="#8d6b4d">KeyboardView · InputConnection</text>
  <path d="M718 414 L872 278" fill="none" stroke="#54708f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M990 314 L990 352" fill="none" stroke="#54708f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M990 424 L990 462" fill="none" stroke="#54708f" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M990 535 C990 650 600 650 600 535" fill="none" stroke="#54708f" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="795" y="670" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#60758d">候选词点击后通过 InputConnection 提交到当前应用</text>
</svg>